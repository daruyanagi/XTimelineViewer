name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # EffectivePlatform を明示しないと、WebView2 SDK がビルドホストの RID(win-x64) を見て
      # x64 の Microsoft.Web.WebView2.Core.dll を arm64 出力に混入させ、arm64 で BadImageFormat になる。
      - name: Build x64
        run: >
          dotnet publish XTimelineViewer.csproj
          -c Release -r win-x64 -p:Platform=x64 -p:EffectivePlatform=x64
          -p:WindowsPackageType=None -p:SelfContained=true
          -o publish/x64

      - name: Build arm64
        run: >
          dotnet publish XTimelineViewer.csproj
          -c Release -r win-arm64 -p:Platform=arm64 -p:PlatformTarget=arm64 -p:EffectivePlatform=arm64
          -p:WindowsPackageType=None -p:SelfContained=true
          -o publish/arm64

      - name: Add launcher (xtv.exe)
        shell: pwsh
        run: |
          # コマンドライン起動用の小さなネイティブランチャーを各 ZIP に同梱する（#264）。
          # ビルド済みの成果物をコミットしてあるためここでは再ビルドしない。
          Copy-Item tools/launcher/xtv.exe publish/x64/xtv.exe   -Force
          Copy-Item tools/launcher/xtv.exe publish/arm64/xtv.exe -Force

      - name: Create ZIP archives
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish/x64/*   -DestinationPath "XTimelineViewer-$tag-win-x64.zip"
          Compress-Archive -Path publish/arm64/* -DestinationPath "XTimelineViewer-$tag-win-arm64.zip"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" \
              "XTimelineViewer-${tag}-win-x64.zip" \
              "XTimelineViewer-${tag}-win-arm64.zip" \
              --clobber
          else
            gh release create "$tag" \
              "XTimelineViewer-${tag}-win-x64.zip" \
              "XTimelineViewer-${tag}-win-arm64.zip" \
              --title "$tag" \
              --generate-notes
          fi

      # winget-pkgs の fork が upstream から遅れていると、次の winget 公開が
      # 「does not have the correct permissions to execute `CreateRef`」で失敗する
      # （権限エラーに見えるが実体は fork の同期ずれ。winget-releaser#319）。
      # 毎回ここで fork を同期しておく。失敗しても公開自体は試みる。
      - name: Sync winget-pkgs fork
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh api -X POST repos/daruyanagi/winget-pkgs/merge-upstream \
            -f branch=master --jq '.message'

      - name: Publish to winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: daruyanagi.XTimelineViewer
          installers-regex: \.zip$
          token: ${{ secrets.WINGET_TOKEN }}
