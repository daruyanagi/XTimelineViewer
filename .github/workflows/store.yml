name: Publish to Microsoft Store

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # v1.2.0 → 1.2.0.0
          $ver = $tag.TrimStart('v') + '.0'
          echo "MSIX_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Update manifest version
        shell: pwsh
        run: |
          $manifest = "Package.appxmanifest"
          # Use raw text replacement to avoid XML encoding issues
          $content = Get-Content -Path $manifest -Raw
          $content = $content -replace '(<Identity[^>]*Version=")[^"]*(")', "`${1}$env:MSIX_VERSION`$2"
          [System.IO.File]::WriteAllText((Resolve-Path $manifest).Path, $content, [System.Text.Encoding]::UTF8)
          # Verify on disk
          $saved = Get-Content -Path $manifest -Raw
          if ($saved -match 'Identity[^>]*Version="([\d.]+)"') {
            Write-Host "Verified on disk: Identity.Version = $($Matches[1])"
            if ($Matches[1] -ne $env:MSIX_VERSION) {
              Write-Error "Manifest update failed! Got $($Matches[1]), expected $env:MSIX_VERSION"
              exit 1
            }
          }

      - name: Restore packages
        run: dotnet restore XTimelineViewer.csproj

      - name: Fix System.Security.Permissions for Windows App SDK build tasks
        shell: pwsh
        run: |
          $pkg = (dotnet nuget locals global-packages --list) -replace "global-packages:\s*", "" |
                 Where-Object { $_ -ne "" } | Select-Object -First 1
          $ssp = "$pkg\system.security.permissions\8.0.0\lib\net8.0\System.Security.Permissions.dll"
          if (-not (Test-Path $ssp)) { Write-Error "Not found: $ssp"; exit 1 }
          $count = 0
          Get-ChildItem "$pkg\microsoft.windowsappsdk" -Recurse -Filter "Microsoft.Build.Msix.dll" |
            ForEach-Object { Copy-Item $ssp $_.DirectoryName -Force; $script:count++ }
          if ($count -eq 0) { Write-Error "Microsoft.Build.Msix.dll not found"; exit 1 }
          Write-Host "Copied to $count location(s)"

      - name: Create self-signed certificate for packaging
        shell: pwsh
        run: |
          $thumb = (New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=B73FDB0C-06E5-4824-9E7F-3AF969921DF4" `
              -KeyUsage "DigitalSignature" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(1)
          ).Thumbprint
          echo "CERT_THUMBPRINT=$thumb" >> $env:GITHUB_ENV
          Write-Host "Certificate thumbprint: $thumb"

      - name: Build x64
        shell: pwsh
        run: |
          dotnet publish XTimelineViewer.csproj `
            -c Release -r win-x64 -p:Platform=x64 `
            -p:AppxPackageDir=.\AppPackages\x64\ `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageVersion=$env:MSIX_VERSION `
            -p:AppxPackageSigningEnabled=true `
            "-p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT"

      - name: Build arm64
        shell: pwsh
        run: |
          dotnet publish XTimelineViewer.csproj `
            -c Release -r win-arm64 -p:Platform=arm64 -p:PlatformTarget=arm64 `
            -p:AppxPackageDir=.\AppPackages\arm64\ `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageVersion=$env:MSIX_VERSION `
            -p:AppxPackageSigningEnabled=true `
            "-p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT"

      - name: Collect MSIX files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\upload
          $files = Get-ChildItem -Recurse -Filter "*.msix" .\AppPackages
          if ($files.Count -eq 0) {
            Write-Error "No MSIX files found in AppPackages! Build may have skipped MSIX generation."
            exit 1
          }
          $files | ForEach-Object {
            $newName = $_.Name -replace '\d+\.\d+\.\d+\.\d+', $env:MSIX_VERSION
            Write-Host "$($_.Name) -> $newName"
            Copy-Item $_.FullName ".\upload\$newName"
          }
          Compress-Archive -Path .\upload\*.msix -DestinationPath .\upload\XTimelineViewer.msixupload
          Write-Host "msixupload created with $($files.Count) package(s)"

      - name: Verify MSIX internal version
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $msix = Get-ChildItem .\AppPackages -Recurse -Filter "*.msix" | Select-Object -First 1
          Write-Host "Inspecting: $($msix.Name)"
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $entry = $zip.Entries | Where-Object { $_.Name -eq "AppxManifest.xml" } | Select-Object -First 1
          $reader = New-Object System.IO.StreamReader($entry.Open())
          $content = $reader.ReadToEnd()
          $reader.Close(); $zip.Dispose()
          if ($content -match 'Identity[^>]*Version="([\d.]+)"') {
            $found = $Matches[1]
            Write-Host "MSIX internal Identity.Version: $found (expected: $env:MSIX_VERSION)"
            if ($found -ne $env:MSIX_VERSION) {
              Write-Error "VERSION MISMATCH! Build identity is wrong."
              exit 1
            }
            Write-Host "✅ Internal version correct"
          }

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure msstore-cli
        run: >
          msstore reconfigure
          --tenantId "${{ secrets.AZURE_TENANT_ID }}"
          --clientId "${{ secrets.AZURE_CLIENT_ID }}"
          --clientSecret "${{ secrets.AZURE_CLIENT_SECRET }}"
          --sellerId "${{ secrets.PARTNER_CENTER_SELLER_ID }}"

      - name: Delete any pending submission
        run: msstore submission delete "9P308HB5BLJ1" --no-confirm
        continue-on-error: true

      - name: Publish to Microsoft Store
        run: msstore publish . -i .\upload -id "9P308HB5BLJ1"
